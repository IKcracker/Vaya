name: Refresh backend artifacts

on:
  push:
    branches:
      - admin-crm
    paths:
      - "web/package.json"
      - "web/lib/db/schema.ts"
      - "web/drizzle.config.ts"

permissions:
  contents: write

jobs:
  backend-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: admin-crm

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh workspace lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh web lockfile
        run: npm install --package-lock-only --ignore-scripts --workspaces=false
        working-directory: web

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Generate Drizzle migration
        run: npm run db:generate
        working-directory: web

      - name: Commit generated backend artifacts
        run: |
          if git diff --quiet -- package-lock.json web/package-lock.json web/drizzle; then
            echo "Backend artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json web/package-lock.json web/drizzle
          git commit -m "Generate Neon backend artifacts"
          git push
