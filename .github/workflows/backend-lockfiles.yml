name: Refresh backend lockfiles

on:
  push:
    branches:
      - admin-crm
    paths:
      - "web/package.json"

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: admin-crm

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh workspace lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh web lockfile
        run: npm install --package-lock-only --ignore-scripts --workspaces=false
        working-directory: web

      - name: Commit generated lockfiles
        run: |
          if git diff --quiet -- package-lock.json web/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json web/package-lock.json
          git commit -m "Update Neon backend lockfiles"
          git push
